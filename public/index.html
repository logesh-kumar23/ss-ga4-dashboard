*{box-sizing:border-box;} html,body{margin:0;padding:0;background:#F7F5EF;}

.f-display{font-family:'Sora',sans-serif;} .f-num{font-family:'IBM Plex Mono',monospace;} .f-body{font-family:'Public Sans',sans-serif;}
.hero-glow{position:relative;background:radial-gradient(1200px 300px at 15% -40%, rgba(255,198,39,0.22), transparent 60%), linear-gradient(180deg,#15171E 0%,#181B23 100%);border-bottom:1px solid #31374A;}
.hero-glow::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,198,39,0.6),transparent);}
.btn-gold{background:linear-gradient(180deg,#FFD44E,#FFC627);box-shadow:0 4px 14px rgba(255,198,39,0.4);transition:transform .12s ease, box-shadow .12s ease;}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,198,39,0.55);} .btn-gold:active{transform:translateY(0);}
.metric-card{transition:transform .12s ease, box-shadow .12s ease;} .metric-card:hover{transform:translateY(-2px);}
.row-hover:hover{background:#FFFBEE;}
.scroll-thin::-webkit-scrollbar{height:8px;} .scroll-thin::-webkit-scrollbar-thumb{background:#E0DCCF;border-radius:8px;}

<script>function GA4SiteExplorer() {

    yellowSoft: "#FFF6DC",
    yellowFaint: "#FFFBEE",
    pos: "#0E8A5F",

  const fmtNum = n => {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";

    return Math.round(n).toLocaleString();
  };
  const fmtPct = n => (n * 100).toFixed(1) + "%";
  const fmtPos = n => n == null || !isFinite(n) ? "—" : n.toFixed(1);

    if (!isFinite(s) || s <= 0) return "0s";

      ss = Math.round(s % 60);
    return m > 0 ? `${m}m ${ss}s` : `${ss}s`;
  };

    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  };

    a.eventCount += r.eventCount;

    setPageInput("");

  };
  const pageMatch = pg => {
    const v = applied.value.trim();
    if (!v || applied.mode === "all") return true;

    if (applied.mode === "prefix") return pg.startsWith(v);
    return pg.includes(v);
  };

  // ---- timeline windows over the 56d daily backbone
  const win = useMemo(() => {

      if (cs < M.dailyStart) cs = M.dailyStart;
      if (ce > M.dailyEnd) ce = M.dailyEnd;
    } else {
      ce = M.dailyEnd;
      cs = addDays(M.dailyEnd, -(preset - 1));
      if (cs < M.dailyStart) cs = M.dailyStart;
    }
    const len = dayCount(cs, ce);
    const pe = addDays(cs, -1);
    const ps = addDays(pe, -(len - 1));
    const canCompare = ps >= M.dailyStart;
    return {

      ce,
      ps,
      pe,
      len,
      canCompare

  const trend = useMemo(() => {

  //      Impressions / Avg position are Google Search Console (organic) metrics, joined by page.
  const pageAgg = useMemo(() => {

        ...r,
        dActiveUsers: r.dActiveUsers != null ? r.dActiveUsers : delta(r.activeUsers, r.prevActiveUsers || 0)
      }));
    } else {
      const prev = new Map((DATA.pagesChanPrev || []).filter(r => r.channel === channel).map(r => [r.page, r]));
      rows = (DATA.pagesChanCur || []).filter(r => r.channel === channel && pageMatch(r.page)).map(r => {
        const p = prev.get(r.page),
          s = seo.get(r.page) || {};
        return {
          page: r.page,
          activeUsers: r.activeUsers,
          prevActiveUsers: p ? p.activeUsers : null,
          dActiveUsers: p && p.activeUsers ? delta(r.activeUsers, p.activeUsers) : null,
          engagedSessions: r.engagedSessions,
          prevEngagedSessions: p ? p.engagedSessions : null,
          engagementRate: r.engagementRate,
          prevEngagementRate: p ? p.engagementRate : null,
          engTime: r.engTime,
          prevEngTime: p ? p.engTime : null,
          eventCount: r.eventCount,
          prevEventCount: p ? p.eventCount : null,
          keyEvents: r.keyEvents,
          prevKeyEvents: p ? p.keyEvents : null,
          impressions: s.impressions != null ? s.impressions : null,
          prevImpressions: s.prevImpressions != null ? s.prevImpressions : null,
          ctr: s.ctr != null ? s.ctr : null,
          position: s.position != null ? s.position : null,
          prevPosition: s.prevPosition != null ? s.prevPosition : null
        };
      });
    }
    const sum = (arr, k) => arr.reduce((s, r) => s + (r[k] || 0), 0);

      activeUsers: sum(rows, "activeUsers"),
      engagedSessions: sum(rows, "engagedSessions"),
      keyEvents: sum(rows, "keyEvents"),
      impressions: sum(rows, "impressions")
    };
    const slicePrev = {
      activeUsers: sum(rows, "prevActiveUsers"),
      engagedSessions: sum(rows, "prevEngagedSessions"),
      keyEvents: sum(rows, "prevKeyEvents"),
      impressions: sum(rows, "prevImpressions")

      rows,
      sliceCur,

    }));

  }, {
    key: "activeUsers",
    label: "Active users",
    fmt: fmtNum
